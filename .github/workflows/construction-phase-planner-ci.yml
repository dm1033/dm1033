name: construction-phase-planner CI

# Checks for the SMSTS training game in construction-phase-planner/.
#
# Modelled on median-ci.yml: the workflow starts on every push to main and
# every pull request, but the jobs only run when files in
# construction-phase-planner/ (or this workflow) change. The final
# "construction-phase-planner CI result" job always reports, so it can be a
# required status check without blocking pull requests that don't touch the
# game. (A workflow filtered out with "paths:" never reports at all, which
# would leave a required check waiting forever.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: construction-phase-planner

jobs:
  changes:
    name: Detect construction-phase-planner changes
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.detect.outputs.cpp }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes to construction-phase-planner/ or this workflow
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              range="origin/$BASE_REF...HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range=""
              else
                range="$BEFORE..$SHA"
              fi ;;
            *)
              range="" ;;
          esac

          if [ -z "$range" ]; then
            echo "No comparison range for $EVENT; running all checks."
            cpp=true
          elif git diff --name-only "$range" | grep -qE '^(construction-phase-planner/|\.github/workflows/construction-phase-planner-ci\.yml$)'; then
            cpp=true
          else
            cpp=false
          fi
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "Changes to construction-phase-planner/ or this workflow: $cpp"

  # Fast feedback: types, scenario data, unit tests with coverage, production build.
  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: construction-phase-planner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (app, scripts and tests)
        run: npm run check

      - name: Validate scenario data
        run: npm run validate:data

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Report open known bugs
        if: always() && matrix.node-version == 24
        run: |
          {
            echo "## Known bugs pinned by the unit tests"
            echo
            echo "Each line is a \`knownBug\` test that asserts the correct behaviour and currently fails."
            echo
            grep -rhoE "knownBug\('BUG [^']+'" src | sed -E "s/knownBug\('BUG /- /; s/'\$//" | sort -V
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Balance simulation still completes every scenario
        run: npx tsx scripts/balance-sim.ts 5

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: construction-phase-planner-coverage
          path: construction-phase-planner/coverage/
          retention-days: 14

      - name: Upload build
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: construction-phase-planner-dist
          path: construction-phase-planner/dist/
          retention-days: 7

  # Browser playthrough of the built app (the existing Playwright smoke test),
  # one scenario per difficulty so all three case studies and all three levels run.
  e2e:
    name: Playthrough (${{ matrix.run.name }})
    needs: [changes, test]
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run:
          - { name: "scenario 1, Learning", args: "0 learner random" }
          - { name: "scenario 2, Standard", args: "1 standard random" }
          - { name: "scenario 3, Expert", args: "2 expert first" }

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: construction-phase-planner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: construction-phase-planner-dist
          path: construction-phase-planner/dist

      - name: Serve the build and play it through
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          npm run smoke -- ${{ matrix.run.args }}

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: construction-phase-planner-smoke-${{ strategy.job-index }}
          path: construction-phase-planner/scripts/smoke-*.png
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: construction-phase-planner/package-lock.json

      - name: Install dependencies
        run: npm ci

      # react and react-dom are the only packages that ship to delegates.
      - name: Audit runtime dependencies (any severity)
        run: npm audit --omit=dev --audit-level=low

      # Build and test tools never ship: fail only on high or critical.
      - name: Audit all dependencies (high and critical)
        run: npm audit --audit-level=high

  # The one job to mark as required in branch protection. It passes when every
  # job passed or was skipped because the game didn't change, and fails if any
  # of them failed or was cancelled.
  result:
    name: construction-phase-planner CI result
    needs: [changes, test, e2e, audit]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check job results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          E2E: ${{ needs.e2e.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "changes=$CHANGES test=$TEST e2e=$E2E audit=$AUDIT"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed ($CHANGES)"
            exit 1
          fi
          for r in "$TEST" "$E2E" "$AUDIT"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A construction-phase-planner CI job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "construction-phase-planner CI passed"
