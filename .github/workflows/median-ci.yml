name: median CI

# Checks for the median project in median/.
#
# The workflow starts on every push to main and every pull request, but the
# test, audit and link jobs only run when files in median/ (or this workflow)
# change; otherwise they are skipped. The final "median CI result" job always
# reports, so it can be a required status check without blocking pull
# requests that don't touch median/. (A workflow filtered out with "paths:"
# never reports at all, which would leave a required check waiting forever.)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 5 * * 1" # weekly, Mondays at 05:53 UTC: new advisories and broken external links
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: median

jobs:
  changes:
    name: Detect median changes
    runs-on: ubuntu-latest
    outputs:
      median: ${{ steps.detect.outputs.median }}
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changes to median/ or this workflow
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              range="origin/$BASE_REF...HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range=""
              else
                range="$BEFORE..$SHA"
              fi ;;
            *)
              range="" ;;
          esac

          if [ -z "$range" ]; then
            echo "No comparison range for $EVENT; running all median checks."
            median=true
          elif git diff --name-only "$range" | grep -qE '^(median/|\.github/workflows/median-ci\.yml$)'; then
            median=true
          else
            median=false
          fi
          echo "median=$median" >> "$GITHUB_OUTPUT"
          echo "Changes to median/ or this workflow: $median"

  test:
    name: Test (Node ${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.median == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: median/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check spelling
        run: npm run spell

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v7
        with:
          name: median-coverage-report
          path: median/coverage/
          retention-days: 14

  audit:
    name: npm audit
    needs: changes
    if: needs.changes.outputs.median == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: median/.nvmrc
          cache: npm
          cache-dependency-path: median/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Summarise all advisories
        if: always()
        run: |
          npm audit --json > audit.json || true
          {
            echo "## npm audit (median)"
            echo
            echo "| Severity | Count |"
            echo "| --- | --- |"
            for level in critical high moderate low info; do
              echo "| $level | $(jq ".metadata.vulnerabilities.$level // 0" audit.json) |"
            done
            echo
            echo "Total: $(jq '.metadata.vulnerabilities.total // 0' audit.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      # The published package has no runtime dependencies, so any advisory
      # here is unexpected and fails the run.
      - name: Audit runtime dependencies (any severity)
        run: npm audit --omit=dev --audit-level=low

      # Development tools never ship to users: fail only on high or critical.
      - name: Audit all dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Verify package signatures and provenance
        run: npm audit signatures

  links:
    name: Check Markdown links
    needs: changes
    if: needs.changes.outputs.median == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: median/.lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          workingDirectory: median
          args: >-
            --config lychee.toml
            --cache
            --max-cache-age 1d
            --no-progress
            './**/*.md'
            './.github/**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The one job to mark as required in branch protection. It passes when every
  # median job passed or was skipped because median/ didn't change, and fails
  # if any of them failed or was cancelled.
  result:
    name: median CI result
    needs: [changes, test, audit, links]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check median job results
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
          LINKS: ${{ needs.links.result }}
        run: |
          echo "changes=$CHANGES test=$TEST audit=$AUDIT links=$LINKS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change detection did not succeed ($CHANGES)"
            exit 1
          fi
          for r in "$TEST" "$AUDIT" "$LINKS"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A median CI job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "median CI passed"
