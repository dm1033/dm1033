<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scaffold Design Visualiser | Launching the app&hellip;</title>
    <meta
      name="description"
      content="Scaffold Design Visualiser by TWC turns site photos and dimensions into CAD-style TG20:21 and TG30:24 scaffold compliance drawings, calculations and design packs."
    />
    <meta property="og:title" content="Scaffold Design Visualiser | CAD TG20 & TG30 Compliance Sheets" />
    <meta
      property="og:description"
      content="Exact-layout scaffold compliance sheets, CAD-style drawings and TWC-ready design packs for principal contractors, scaffold contractors and TWC teams."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.visualscaffolddesign.com" />
    <link rel="canonical" href="https://scaffoldapp-dlpfkbtn.manus.space/" />
    <meta http-equiv="refresh" content="0; url=https://scaffoldapp-dlpfkbtn.manus.space/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f4f1ea;
        --ink: #0f172a;
        --ink-soft: #1e293b;
        --rule: #d6d1c4;
        --accent: #e85d04;
        --grid: rgba(15, 23, 42, 0.06);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        text-align: center;
      }
      .card {
        max-width: 520px;
      }
      .brand {
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-stretch: 80%;
        font-size: 22px;
        letter-spacing: 0.02em;
        margin-bottom: 32px;
      }
      h1 {
        font-family: "Archivo", sans-serif;
        font-weight: 900;
        font-stretch: 85%;
        font-size: clamp(28px, 4vw, 36px);
        line-height: 1.1;
        letter-spacing: -0.01em;
        margin: 0 0 16px;
      }
      .sub {
        color: var(--ink-soft);
        font-size: 14px;
        margin: 0 0 28px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: 1px;
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.85);
        }
      }
      .cta {
        display: inline-block;
        padding: 14px 22px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        text-decoration: none;
        font-family: "IBM Plex Mono", monospace;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .cta:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .small {
        margin-top: 24px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">Scaffold Design Visualiser</div>
      <h1><span class="dot"></span>Launching the visualiser&hellip;</h1>
      <p class="sub">
        Redirecting you to the live tool. If the page does not load automatically,
        use the button below.
      </p>
      <a class="cta" href="https://scaffoldapp-dlpfkbtn.manus.space/">Open the visualiser</a>
      <div class="small">TG20:21 &nbsp;&middot;&nbsp; TG30:24 &nbsp;&middot;&nbsp; CAD-grade compliance</div>
    </div>
    <script>
      window.location.replace("https://scaffoldapp-dlpfkbtn.manus.space/");
    </script>
  </body>
</html>
