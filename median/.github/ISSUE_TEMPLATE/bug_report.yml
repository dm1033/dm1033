name: Bug report
description: Report a wrong result, crash or other problem with median().
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Don't use this form for security vulnerabilities.** Report those privately, as described in SECURITY.md.
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The exact array or value you passed to median().
      placeholder: "median([10, 9, 2])"
      render: js
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected result
      placeholder: "9"
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual result
      description: The value returned, or the error message if it threw.
      placeholder: "2"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps explain the problem, such as how you're calling the function.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release version, or the commit hash if you're using code from main.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v24.1.0"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this hasn't been reported.
          required: true
        - label: This is not a security vulnerability.
          required: true
